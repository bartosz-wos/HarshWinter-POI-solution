<text x="74.0" y="236.0" font-size="11.5" fill="#6b7280">Inside a gap the envelope is exactly two lines, min(p + A_t, -p + B_t); they cross at (B_t - A_t)/2, which need not be a</text>
<text x="74.0" y="251.0" font-size="11.5" fill="#6b7280">station. A_t and B_t contain no p, so a segment tree can hold them.</text>
