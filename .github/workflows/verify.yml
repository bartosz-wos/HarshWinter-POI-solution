name: build and verify

# The suite is the only thing standing between this repo and a wrong claim, so
# it runs on every push.  It is fast enough to be worth the wall clock and slow
# enough that skipping it is tempting, which is exactly why it is not optional.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          # `time` is a separate package on both Fedora and Ubuntu and is NOT
          # present on a bare runner.  run_tests.sh calls /usr/bin/time -f, and
          # the bash keyword does not accept -f, so without this the full-suite
          # job fails at the full-limit benchmark with no obvious cause.
          sudo apt-get install -y g++ python3 python3-pip time
          # PEP 668: Ubuntu 24.04's pip refuses an install into the system
          # environment, so a bare `pip install --user pymupdf` exits 1 and
          # pymupdf never lands anywhere importable.  That is what failed the
          # verify job three times while the step itself still reported success.
          pip install --break-system-packages pymupdf
          # Fail loudly here rather than 6 minutes into the suite.
          /usr/bin/time -f "%e" true >/dev/null
          python3 -c "import pymupdf" || { echo "::error::pymupdf not importable"; exit 1; }
          typst --version

      - name: install typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1

      - name: run the full suite
        # tee + pipefail, so the log survives the failure.  The job log endpoint
        # needs admin rights, which is exactly why a plain failing step left me
        # unable to tell which suite broke; the artifact is readable by anyone
        # with the repo.
        run: |
          set -o pipefail
          ./run_tests.sh 2>&1 | tee suite.log
        if: always()

      - name: upload the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: suite.log
          if-no-files-found: warn

      - name: build the editorial
        # The suite builds this too, but the PDF is a deliverable and not just an
        # assertion, so it is uploaded as an artifact.
        run: ./docs/build_editorial.sh

      - name: upload the editorial
        uses: actions/upload-artifact@v4
        with:
          name: editorial
          path: docs/editorial.pdf

  # The quick mode skips the full-limit run, so a green quick run is not proof
  # the headline timings still hold.  This job re-measures them on every push and
  # fails if the solution has stopped fitting the constraints.
  limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y g++ python3 time

      - name: build
        run: ./build.sh

      - name: the benchmark input must be legal
        run: |
          ./build/gen_random 250000 250000 1000000000 999999 7 > full.in
          ./build/validate_input full.in

      - name: the submission must fit the memory limit
        run: |
          /usr/bin/time -v ./build/sur < full.in > /dev/null 2> time.txt
          peak_kb=$(grep 'Maximum resident' time.txt | grep -oE '[0-9]+')
          echo "peak RSS: ${peak_kb} KB"
          # 256 MB limit, with headroom for the allocator's own accounting.
          if [ "$peak_kb" -gt 200000 ]; then
            echo "::error::peak RSS ${peak_kb} KB is too close to the 256 MB limit"
            exit 1
          fi
